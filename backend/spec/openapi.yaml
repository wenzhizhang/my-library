          description: Nation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  nations: { type: array, items: { type: string } }
  /api/authors/dynasties:
    get:
      tags: [Authors]
      summary: List valid dynasty values
      responses:
        "200":
          description: Dynasty list
          content:
            application/json:
              schema:
                type: object
                properties:
                  dynasties: { type: array, items: { type: string } }
