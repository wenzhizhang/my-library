  # ═══════════════════════════════════════════════
  # Stats
  # ═══════════════════════════════════════════════
  /api/stats/page-view:
    post:
      tags: [Stats]
      summary: Log a frontend page view
      responses:
        "200":
          description: Total visits
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_visits: { type: integer }

  /api/stats/summary:
    get:
      tags: [Stats]
      summary: Get total page-view count
      description: Global stats DB — the bearer token does not change the result.
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_visits: { type: integer }

  /api/stats/visits:
    get:
      tags: [Stats]
      summary: List page views (newest first)
      description: Returns a bare JSON array (no pagination envelope) from the global stats DB.
      parameters:
        - { name: limit, in: query, schema: { type: integer }, description: "Omit for all rows; 0 is treated as no limit" }
        - { name: skip, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Visit list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ip: { type: string }
                    path: { type: string, nullable: true }
                    timestamp: { type: string, nullable: true, description: "Naive local ISO-8601, no timezone" }

  # ═══════════════════════════════════════════════
  # RAG
  # ═══════════════════════════════════════════════
  /api/rag/search:
    post:
      tags: [RAG]
      summary: Semantic book search (RAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagSearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagSearchResponse"

  /api/rag/reindex:
    post:
      tags: [RAG]
      summary: Trigger a full background reindex
      description: |
        Returns immediately; poll GET /api/rag/status for progress. Always answers
        200, even when a reindex is already running. The job reindexes
        `demo.db` (the shared demo database), not the caller's user database.
      responses:
        "200":
          description: Reindex trigger result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagReindexResponse"

  /api/rag/status:
    get:
      tags: [RAG]
      summary: Get RAG indexing status
      responses:
        "200":
          description: RAG status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagStatusResponse"

  # ═══════════════════════════════════════════════
  # ISBN Lookup
  # ═══════════════════════════════════════════════
  /api/isbn/{isbn}:
    get:
      tags: [ISBN]
      summary: Look up book metadata by ISBN (user DB → root.db → external)
      description: |
        Three-tier lookup: user's own DB → shared root.db → external APIs.
        Existing books in user DB or root.db are returned instantly without
        hitting external services. Authors and publishers found in root.db
        are copied to the user's DB automatically.
      parameters:
        - name: isbn
          in: path
          required: true
          schema: { type: string }
          description: ISBN-10 or ISBN-13 (hyphens optional)
      responses:
        "200":
          description: Book metadata found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsbnLookupResponse"
        "404":
          description: ISBN not found or no source returned data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  # ═══════════════════════════════════════════════
  # Export
  # ═══════════════════════════════════════════════
  /api/export/:
    get:
      tags: [Export]
      summary: Export data in various formats
      security: [{ BearerAuth: [] }]
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [sql, csv, excel, markdown, json] }
          description: Output format
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [books, authors, publishers, brands, series, categories, bookshelves, collections] }
          description: Entity type to export
      responses:
        "200":
          description: File download
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  /api/export/database:
    get:
      tags: [Export]
      summary: Download the current user's entire database as a SQLite file
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: SQLite database file download
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "404":
          description: Database file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  /api/export/sync-to-root:
    post:
      tags: [Export]
      summary: Sync user database to shared root.db
      description: |
        Syncs reference data (authors, publishers, brands, series, categories, books)
        from the current user's database to the shared root.db. Dependency order:
        reference tables first, then books, then book-author mappings.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: differential
          in: query
          schema: { type: boolean, default: true }
          description: If true, only sync changed/missing entries; false for full resync
      responses:
        "200":
          description: Sync result with per-table counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  differential: { type: boolean }
                  counts:
                    type: object
                    description: One entry per table synced, each with its totals.
                    additionalProperties:
                      type: object
                      properties:
                        total: { type: integer }
                        synced: { type: integer }
                        failed: { type: integer }
                  diagnostics:
                    type: object
                    nullable: true
                    description: >-
                      What the sync observed about root.db while it ran. Unknown keys are ignored by
                      clients, so this may grow without a breaking change.
                    properties:
                      root_db_tables:
                        type: array
                        items: { type: string }
                      root_db_path: { type: string }
                      root_db_error: { type: string }
                  errors:
                    type: array
                    nullable: true
                    description: Up to 20 messages for rows that failed to upsert; null when none did.
                    items: { type: string }
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  # ═══════════════════════════════════════════════
  # Config
  # ═══════════════════════════════════════════════
  /api/config/purchase-stores:
    get:
      tags: [Config]
      summary: List purchase store options
      responses:
        "200":
          description: Purchase store list
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase_stores:
                    type: array
                    items: { type: string }

  # ═══════════════════════════════════════════════
  # Backgrounds
  # ═══════════════════════════════════════════════
  /api/backgrounds:
    get:
      tags: [Backgrounds]
      summary: List available background images
      description: |
        Hot-reloaded from `backend/config/backgrounds.json` on every request —
        updating that file does not require rebuilding the image or container.
      responses:
        "200":
          description: Background list with the configured default id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundListResponse"
  /api/backgrounds/me:
    get:
      tags: [Backgrounds]
      summary: Get the caller's saved background id
      description: |
        Requires no auth for guests, who always receive `background_id: null`
        (default background). Authenticated users get their own saved choice.
      responses:
        "200":
          description: The caller's background selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundSelectionResponse"
    put:
      tags: [Backgrounds]
      summary: Save the caller's background choice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackgroundSelectionRequest"
      responses:
        "200":
          description: Saved selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundSelectionResponse"
        "400":
          description: Unknown background id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  # ═══════════════════════════════════════════════
  # Stats — Books
  # ═══════════════════════════════════════════════
  /api/stats/books:
    get:
      tags: [Stats]
      summary: Comprehensive book library statistics
      description: Counts include wishlist and archived books. Uses the caller's database (optional bearer token).
      responses:
        "200":
          description: Statistics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  overview:
                    type: object
                    properties:
                      total_books: { type: integer }
                      total_authors: { type: integer }
                      total_publishers: { type: integer }
                      total_categories: { type: integer }
                      avg_price: { type: number }
                      avg_purchase_price: { type: number }
                      total_spent: { type: number }
                  by_read_state:
                    type: array
                    items: { $ref: "#/components/schemas/NameCount" }
                  by_category:
                    type: array
                    items: { $ref: "#/components/schemas/NameCount" }
                  by_binding:
                    type: array
                    items: { $ref: "#/components/schemas/NameCount" }
                  by_language:
                    type: array
                    items: { $ref: "#/components/schemas/NameCount" }
                  top_authors:
                    type: array
                    items: { $ref: "#/components/schemas/NameCount" }
                  top_publishers:
                    type: array
                    items: { $ref: "#/components/schemas/NameCount" }
                  by_score:
                    type: array
                    description: 'Buckets: "9.0+", "8.0-8.9", "7.0-7.9", "6.0-6.9", "< 6.0"; empty buckets are omitted'
                    items: { $ref: "#/components/schemas/NameCount" }
                  by_compose:
                    type: array
                    items: { $ref: "#/components/schemas/NameCount" }
                  timeline_months:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        year: { type: integer }
                        month: { type: integer }
                        count: { type: integer }
                  timeline_years:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        year: { type: integer }
                        count: { type: integer }
                  purchase_months:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        year: { type: integer }
                        month: { type: integer }
                        count: { type: integer }
                        price: { type: number }
                  purchase_years:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        year: { type: integer }
                        count: { type: integer }
                        price: { type: number }

  # ═══════════════════════════════════════════════
  # Media proxy
  # ═══════════════════════════════════════════════
  /api/media/{path}:
    get:
      tags: [Media]
      summary: Proxy (and optionally cache) a media file from the CDN
      description: |
        Streams the file from `https://cdn.dingfengbo.top/media`. Local disk caching
        is off unless `MEDIA_CACHE_ENABLED=true`. Returns the binary body, not JSON.
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: Catch-all path (may contain slashes); leading slashes are stripped
      responses:
        "200":
          description: The media file
          content:
            image/*:
              schema: { type: string, format: binary }
        "400":
          description: Invalid path (contains "..")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "404":
          description: Image not found on CDN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "502":
          description: Failed to fetch image from CDN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  # ═══════════════════════════════════════════════
  # Authors — nations/dynasties
  # ═══════════════════════════════════════════════
  /api/authors/nations:
    get:
      tags: [Authors]
      summary: List valid nation values
      responses:
