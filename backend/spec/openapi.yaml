openapi: "3.1.1"
info:
  title: My Library API
  description: |
    Book library management system.
    All endpoints return JSON. Some endpoints require authentication
    (Bearer token from `/api/auth/login`).

    Auth is opt-in: write endpoints answer 401 without a token, while the read
    endpoints accept an *optional* Bearer token. A valid token also selects the
    caller's own SQLite database; without one, reads fall back to the shared
    `demo.db`. The only endpoints that 401 are those marked with the BearerAuth
    security scheme (plus `GET /api/auth/me`).
  version: "0.4.0"
  contact:
    name: My Library
servers:
  - url: http://127.0.0.1:8000
    description: Local development
  - url: https://dingfengbo.top/my-library
    description: Production

tags:
  - name: Auth
  - name: Books
  - name: Authors
  - name: Publishers
  - name: Brands
  - name: Series
  - name: Categories
  - name: Bookshelves
  - name: Book Collections
  - name: Reading Plans
  - name: Applications
  - name: Stats
  - name: RAG
  - name: ISBN
  - name: Export
  - name: Config
  - name: Backgrounds
  - name: Media
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Auth ──
    UserRegister:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    UserLogin:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      required: [access_token, user_id, username, uuid]
      properties:
        access_token: { type: string }
        token_type: { type: string, default: "bearer" }
        user_id: { type: integer }
        username: { type: string }
        uuid: { type: string }
    UserInfo:
      type: object
      required: [id, username, uuid]
      properties:
        id: { type: integer }
        username: { type: string }
        uuid: { type: string }
        created_at: { type: string, format: date-time, nullable: true }

    # ── Backgrounds ──
    BackgroundItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
    BackgroundListResponse:
      type: object
      required: [default_id, backgrounds]
      properties:
        default_id: { type: string }
        backgrounds:
          type: array
          items: { $ref: "#/components/schemas/BackgroundItem" }
    BackgroundSelectionRequest:
      type: object
      required: [background_id]
      properties:
        background_id: { type: string }
    BackgroundSelectionResponse:
      type: object
      properties:
        background_id: { type: string, nullable: true }

    # ── Book ──
    BookCreation:
      type: object
      required: [isbn, title_cn, title]
      properties:
        isbn: { type: string }
        title: { type: string }
        title_cn: { type: string }
        author_ids: { type: array, items: { type: integer } }
        translator: { type: string, nullable: true }
        publisher_id: { type: integer, nullable: true }
        publish_date: { type: string, nullable: true }
        brand_id: { type: integer, nullable: true }
        book_series_id: { type: integer, nullable: true }
        binding_type: { type: string, nullable: true }
        paper_type: { type: string, nullable: true }
        pages: { type: integer, nullable: true }
        book_count: { type: integer, nullable: true }
        language: { type: string, nullable: true }
        compose_type: { type: string, nullable: true }
        price: { type: number, nullable: true }
        purchase_price: { type: number, nullable: true }
        purchase_date: { type: string, nullable: true }
        thumb_image: { type: string, nullable: true }
        category_id: { type: integer, nullable: true }
        bookshelf_id: { type: integer, nullable: true }
        read_state: { type: string, nullable: true }
        catalog: { type: string, nullable: true }
        introduction: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        registered: { type: boolean, nullable: true }
        edition: { type: string, nullable: true }
        printing_info: { type: string, nullable: true }
        printed_number: { type: integer, nullable: true }
        douban_score: { type: number, nullable: true }
        purchase_store: { type: string, nullable: true }
        tags: { type: array, nullable: true, items: { type: string } }
        in_wish: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    BookUpdate:
      type: object
      properties:
        isbn: { type: string }
        title: { type: string }
        title_cn: { type: string }
        author_ids: { type: array, items: { type: integer } }
        translator: { type: string, nullable: true }
        publisher_id: { type: integer, nullable: true }
        publish_date: { type: string, nullable: true }
        brand_id: { type: integer, nullable: true }
        book_series_id: { type: integer, nullable: true }
        binding_type: { type: string, nullable: true }
        paper_type: { type: string, nullable: true }
        pages: { type: integer, nullable: true }
        book_count: { type: integer, nullable: true }
        language: { type: string, nullable: true }
        compose_type: { type: string, nullable: true }
        price: { type: number, nullable: true }
        purchase_price: { type: number, nullable: true }
        purchase_date: { type: string, nullable: true }
        thumb_image: { type: string, nullable: true }
        link: { type: string, nullable: true }
        category_id: { type: integer, nullable: true }
        bookshelf_id: { type: integer, nullable: true }
        read_state: { type: string, nullable: true }
        catalog: { type: string, nullable: true }
        introduction: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        registered: { type: boolean, nullable: true }
        edition: { type: string, nullable: true }
        printing_info: { type: string, nullable: true }
        printed_number: { type: integer, nullable: true }
        douban_score: { type: number, nullable: true }
        purchase_store: { type: string, nullable: true }
        tags: { type: array, nullable: true, items: { type: string } }
        in_wish: { type: boolean }
        updated_at: { type: string, format: date-time }
    BookResponse:
      type: object
      required: [id, isbn, title_cn, title]
      properties:
        id: { type: integer }
        isbn: { type: string }
        title: { type: string }
        title_cn: { type: string }
        authors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        translator: { type: string, nullable: true }
        publisher: { $ref: "#/components/schemas/PublisherSimple", nullable: true }
        publish_date: { type: string, format: date-time, nullable: true }
        brand: { $ref: "#/components/schemas/BrandSimple", nullable: true }
        book_series: { $ref: "#/components/schemas/SeriesSimple", nullable: true }
        binding_type: { type: string, nullable: true }
        paper_type: { type: string, nullable: true }
        pages: { type: integer, nullable: true }
        book_count: { type: integer, nullable: true }
        language: { type: string, nullable: true }
        compose_type: { type: string, nullable: true }
        price: { type: number, nullable: true }
        purchase_price: { type: number, nullable: true }
        purchase_date: { type: string, format: date-time, nullable: true }
        thumb_image: { type: string, nullable: true }
        link: { type: string, nullable: true }
        category: { $ref: "#/components/schemas/CategorySimple", nullable: true }
        bookshelf: { $ref: "#/components/schemas/BookshelfSimple", nullable: true }
        read_state: { type: string, nullable: true }
        catalog: { type: string, nullable: true }
        introduction: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        registered: { type: boolean, nullable: true }
        edition: { type: string, nullable: true }
        printing_info: { type: string, nullable: true }
        printed_number: { type: integer, nullable: true }
        douban_score: { type: number, nullable: true }
        purchase_store: { type: string, nullable: true }
        tags: { type: array, nullable: true, items: { type: string } }
        in_wish: { type: boolean, nullable: true }
        archived: { type: boolean, nullable: true }

    # ── Simple ref types ──
    PublisherSimple:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    BrandSimple:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    SeriesSimple:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    CategorySimple:
      type: object
      required: [id, path]
      properties:
        id: { type: integer }
        path: { type: string }
    BookshelfSimple:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    IdName:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    # ── Book list item (serializers.serialize_book) ──
    BookCard:
      type: object
      description: |
        Slim book shape returned by every paginated book-list endpoint.
        `authors` are display strings ("[宋] 苏轼" / "[中国] 鲁迅"), not objects.
      properties:
        id: { type: integer }
        isbn: { type: string, nullable: true }
        title_cn: { type: string, nullable: true }
        title: { type: string }
        thumb_image: { type: string, nullable: true }
        authors:
          type: array
          items: { type: string }
        publisher: { $ref: "#/components/schemas/IdName", nullable: true }
        category: { $ref: "#/components/schemas/IdName", nullable: true }

    BookListPage:
      type: object
      properties:
        books:
          type: array
          items: { $ref: "#/components/schemas/BookCard" }
        total_pages: { type: integer }
        total_books: { type: integer }

    # ── Entity list items (slim shapes returned by the entity list endpoints) ──
    AuthorSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        name_cn: { type: string, nullable: true }
        nation: { type: string }
        dynasty: { type: string, nullable: true }
        intro: { type: string, nullable: true }
        photo: { type: string, nullable: true }
        weight: { type: integer }
    PublisherSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        weight: { type: integer }
    BrandSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        weight: { type: integer }
    SeriesSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        weight: { type: integer }
    CategorySummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        parent_id: { type: integer, nullable: true }
        intro: { type: string, nullable: true }
        depth: { type: integer, nullable: true }
        path: { type: string, nullable: true }
        weight: { type: integer }
    BookshelfSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }

    # ── Author ──
    AuthorCreation:
      type: object
      required: [name, name_cn]
      properties:
        name: { type: string }
        name_cn: { type: string }
        nation: { type: string, default: "无", description: "Must be one of /api/authors/nations" }
        dynasty: { type: string }
        intro: { type: string }
        photo: { type: string }
    AuthorUpdate:
      type: object
      properties:
        name: { type: string }
        name_cn: { type: string }
        nation: { type: string }
        dynasty: { type: string }
        intro: { type: string }
        photo: { type: string }
    AuthorResponse:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        name_cn: { type: string }
        nation: { type: string }
        dynasty: { type: string, nullable: true }
        intro: { type: string, nullable: true }
        photo: { type: string, nullable: true }
        weight: { type: integer, default: 0 }
        books:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/BookSimple"

    # ── Book Simple (used in collections/authors) ──
    BookSimple:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        title_cn: { type: string, nullable: true }
        thumb_image: { type: string, nullable: true }
        isbn: { type: string, nullable: true }
        authors:
          type: array
          nullable: true
          items: { type: string }

    # ── Publisher ──
    PublisherCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
        logo: { type: string }
    PublisherUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
        logo: { type: string }
    PublisherResponse:
      type: object
      required: [id, name, books]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        weight: { type: integer, default: 0 }
        books:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookSimple" }

    # ── Brand ──
    BrandCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
    BrandUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
    BrandResponse:
      type: object
      required: [id, name, books]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        weight: { type: integer, default: 0 }
        books:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookSimple" }

    # ── Series ──
    BookSeriesCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
    BookSeriesUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
    BookSeriesResponse:
      type: object
      required: [id, name, books]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        weight: { type: integer, default: 0 }
        books:
          type: array
          items: { $ref: "#/components/schemas/BookSimple" }

    # ── Category ──
    CategoryCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        parent: { type: integer, description: "Parent category ID" }
        intro: { type: string }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string }
        parent: { type: integer, nullable: true, description: "Parent category ID" }
        intro: { type: string }
    CategoryResponse:
      type: object
      required: [id, name, books]
      properties:
        id: { type: integer }
        name: { type: string }
        parent: { type: integer, nullable: true }
        intro: { type: string, nullable: true }
        depth: { type: integer, nullable: true }
        path: { type: string, nullable: true }
        weight: { type: integer, default: 0 }
        books:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookSimple" }

    # ── Bookshelf ──
    BookshelfCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
    BookshelfUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
    BookshelfResponse:
      type: object
      required: [id, name, books]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        total_books: { type: integer, nullable: true }
        total_sets: { type: integer, nullable: true }
        books:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookSimple" }

    # ── Book Collection ──
    BookCollectionCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
    BookCollectionUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
    AddBookToCollection:
      type: object
      required: [book_id]
      properties:
        book_id: { type: integer }
    BatchAddBooks:
      type: object
      required: [book_ids]
      properties:
        book_ids: { type: array, items: { type: integer } }
    BookCollectionSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        total_books: { type: integer, default: 0 }
        weight: { type: integer, default: 0 }
    BookCollectionResponse:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        total_books: { type: integer, nullable: true }
        weight: { type: integer, default: 0 }
        books:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/BookSimple"
    BookCollectionListResponse:
      type: object
      required: [book_collections, total_pages, total_collections]
      properties:
        book_collections:
          type: array
          items:
            $ref: "#/components/schemas/BookCollectionSummary"
        total_pages: { type: integer }
        total_collections: { type: integer }

    # ── Reading Plan ──
    ReadingPlanCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
    ReadingPlanUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
    AddBookToPlan:
      type: object
      required: [book_id]
      properties:
        book_id: { type: integer }
    ReadingPlanBookSimple:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        title_cn: { type: string, nullable: true }
        thumb_image: { type: string, nullable: true }
        isbn: { type: string, nullable: true }
        authors:
          type: array
          nullable: true
          items: { type: string }
        read_state: { type: string, nullable: true }
        book_count: { type: integer, nullable: true }
    ReadingPlanSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        created_at: { type: string, nullable: true }
        total_books: { type: integer }
        progress: { type: number, nullable: true }
    ReadingPlanResponse:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        total_books: { type: integer, nullable: true }
        progress: { type: number, nullable: true }
        books:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ReadingPlanBookSimple"
    ReadingPlanListResponse:
      type: object
      required: [reading_plans, total_pages, total_plans]
      properties:
        reading_plans:
          type: array
          items:
            $ref: "#/components/schemas/ReadingPlanSummary"
        total_pages: { type: integer }
        total_plans: { type: integer }

    # ── Application ──
    ApplicationCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        url: { type: string, nullable: true }
        icon_url: { type: string, nullable: true }
        sort_order: { type: integer, nullable: true, default: 0 }
    ApplicationUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        url: { type: string, nullable: true }
        icon_url: { type: string, nullable: true }
        sort_order: { type: integer, nullable: true }
    ApplicationResponse:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        url: { type: string, nullable: true }
        icon_url: { type: string, nullable: true }
        sort_order: { type: integer, nullable: true, default: 0 }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    # ── RAG ──
    RagSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        top_k: { type: integer, default: 10, minimum: 1, maximum: 100 }
        alpha: { type: number, default: 0.5, minimum: 0, maximum: 1, description: "Vector weight (0 = FTS5 only, 1 = pure vector)" }
    RagSearchResultItem:
      type: object
      required: [book_id, score]
      properties:
        book_id: { type: integer }
        score: { type: number }
        title: { type: string, nullable: true }
        title_cn: { type: string, nullable: true }
        authors:
          type: array
          items: { type: string }
    RagSearchResponse:
      type: object
      required: [query, total, results]
      properties:
        query: { type: string }
        total: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/RagSearchResultItem" }
    RagReindexResponse:
      type: object
      properties:
        status: { type: string, default: "idle", description: "idle | indexing | completed | error" }
        message: { type: string, default: "" }
    RagStatusResponse:
      type: object
      required: [indexed_count, total_books, model_loaded]
      properties:
        indexed_count: { type: integer }
        total_books: { type: integer }
        model_loaded: { type: boolean }
        reindex_status: { type: string, default: "idle" }
        reindex_indexed: { type: integer, default: 0 }
        reindex_failed: { type: integer, default: 0 }
        reindex_total: { type: integer, default: 0 }
        reindex_detail: { type: string, default: "" }

    # ── ISBN Lookup ──
    IsbnLookupResponse:
      type: object
      required: [isbn]
      properties:
        isbn: { type: string }
        title: { type: string, default: "" }
        title_cn: { type: string, default: "" }
        publisher_name: { type: string, default: "" }
        publisher_id: { type: integer, nullable: true }
        publish_date: { type: string, default: "" }
        pages: { type: integer, nullable: true }
        price: { type: number, nullable: true }
        summary: { type: string, default: "" }
        introduction: { type: string, default: "" }
        thumb_image: { type: string, default: "" }
        binding_type: { type: string, default: "" }
        douban_score: { type: number, nullable: true }
        author_names: { type: array, items: { type: string } }
        author_ids: { type: array, items: { type: integer } }
        translator: { type: string, default: "" }
        language: { type: string, default: "" }
        source: { type: string, default: "" }
        link: { type: string, default: "" }
        catalog: { type: string, default: "" }
        tag_names: { type: array, items: { type: string } }
        author_intro: { type: string, default: "" }
        brand_id: { type: integer, nullable: true }
        brand_name: { type: string, nullable: true }
        book_id: { type: integer, nullable: true }
        book_name: { type: string, default: "" }
        book_series_id: { type: integer, nullable: true }
        book_series_name: { type: string, default: "" }
        paper_type: { type: string, default: "" }
        book_count: { type: integer, nullable: true }
        compose_type: { type: string, default: "" }
        edition: { type: string, default: "" }
        printing_info: { type: string, default: "" }
        printed_number: { type: integer, nullable: true }
        category_id: { type: integer, nullable: true }
        category_path: { type: string, nullable: true }

    # ── Error ──
    NameCount:
      type: object
      properties:
        name: { type: string }
        count: { type: integer }
    HTTPError:
      type: object
      properties:
        detail: { type: string }

paths:
  # ═══════════════════════════════════════════════
  # Auth
  # ═══════════════════════════════════════════════
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegister"
      responses:
        "200":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  /api/auth/db-info:
    get:
      tags: [Auth]
      summary: Get current user's database info
      security:
        - BearerAuth: []
      responses:
        "200":
          description: DB info
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  uuid: { type: string }
                  db: { type: string }
                  exists: { type: boolean }
                  type: { type: string }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"

  # ═══════════════════════════════════════════════
  # Books
  # ═══════════════════════════════════════════════
  /api/books:
    get:
      tags: [Books]
      summary: List books (paginated)
      description: Returns books with in_wish=false AND archived=false only. Items are the slim card shape (not BookResponse).
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: sort_by, in: query, schema: { type: string, default: title, enum: [title, created_at, book_series] }, description: "Any other value falls back to ordering by id" }
        - { name: isbn, in: query, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: publisher, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: "Free text over title, title_cn and isbn" }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: purchase_year, in: query, schema: { type: integer } }
        - { name: purchase_month, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Paginated book list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListPage"
    post:
      tags: [Books]
      summary: Create a new book
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreation"
      responses:
        "200":
          description: Created book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"

  /api/books/search:
    get:
      tags: [Books]
      summary: Search books with filters (unpaginated)
      description: Returns every matching book (in_wish=false, archived=false) as a full BookResponse. No page/limit/sort_by — results come back in id order.
      parameters:
        - { name: isbn, in: query, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: publisher, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: "Free text over title, title_cn and isbn" }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: purchase_year, in: query, schema: { type: integer } }
        - { name: purchase_month, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"

  /api/books/titles:
    get:
      tags: [Books]
      summary: Get all book titles (lightweight, for dropdowns)
      description: Returns {id, name, thumb_image, book_count} rows for non-wishlist, non-archived books.
      responses:
        "200":
          description: Book title list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    thumb_image: { type: string, nullable: true }
                    book_count: { type: integer, nullable: true }

  /api/books/wishlist:
    get:
      tags: [Books]
      summary: List wishlist books (in_wish=true, paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: sort_by, in: query, schema: { type: string, default: created_at, enum: [title, created_at, book_series] } }
      responses:
        "200":
          description: Paginated wishlist (total_pages is 1, not 0, when empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListPage"

  /api/books/archived:
    get:
      tags: [Books]
      summary: List archived books (archived=true, paginated)
      description: No in_wish filter — a book that is both wishlisted and archived shows up here.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: sort_by, in: query, schema: { type: string, default: title, enum: [title, created_at, book_series] } }
      responses:
        "200":
          description: Paginated archived books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListPage"

  /api/books/{book_id}:
    get:
      tags: [Books]
      summary: Get book details
      parameters:
        - { name: book_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "404":
          description: Book not found
    put:
      tags: [Books]
      summary: Update a book
      security:
        - BearerAuth: []
      parameters:
        - { name: book_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
    delete:
      tags: [Books]
      summary: Delete a book
      security:
        - BearerAuth: []
      parameters:
        - { name: book_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/books/{book_id}/archive:
    put:
      tags: [Books]
      summary: Archive a book (sets archived=true)
      description: Returns only a message — the updated book is not returned. There is no unarchive endpoint (BookUpdate has no archived field), so the flag can only be cleared by editing the database directly.
      security:
        - BearerAuth: []
      parameters:
        - { name: book_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, description: '"Book archived"' }
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  /api/books/{book_id}/similar:
    get:
      tags: [Books]
      summary: Get similar books (shared tags)
      parameters:
        - { name: book_id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 5 } }
      responses:
        "200":
          description: Similar books ranked by number of shared tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  book:
                    type: object
                    description: The reference book (id + display title)
                    properties:
                      id: { type: integer }
                      title: { type: string }
                  similar_books:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        isbn: { type: string, nullable: true }
                        title_cn: { type: string, nullable: true }
                        title: { type: string }
                        thumb_image: { type: string, nullable: true }
                        authors:
                          type: array
                          items: { $ref: "#/components/schemas/IdName" }
                        tags: { type: array, items: { type: string } }
                        shared_tags: { type: array, items: { type: string } }
                        shared_count: { type: integer }
        "404":
          description: Book not found

