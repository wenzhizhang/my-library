openapi: "3.1.1"
info:
  title: My Library API
  description: |
    Book library management system.
    All endpoints return JSON. Some endpoints require authentication
    (Bearer token from `/api/auth/login`).
  version: "0.3.0"
  contact:
    name: My Library
servers:
  - url: http://127.0.0.1:8000
    description: Local development
  - url: https://dingfengbo.top/my-library
    description: Production

tags:
  - name: Auth
  - name: Books
  - name: Authors
  - name: Publishers
  - name: Brands
  - name: Series
  - name: Categories
  - name: Bookshelves
  - name: Book Collections
  - name: Reading Plans
  - name: Applications
  - name: Stats
  - name: RAG
  - name: ISBN
  - name: Export
  - name: Config
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Auth ──
    UserRegister:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 4 }
    UserLogin:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, default: "bearer" }
        user_id: { type: integer }
        username: { type: string }
        uuid: { type: string }
    UserInfo:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        uuid: { type: string }

    # ── Book ──
    BookCreation:
      type: object
      required: [isbn, title]
      properties:
        isbn: { type: string }
        title: { type: string }
        title_cn: { type: string }
        author_ids: { type: array, items: { type: integer } }
        translator: { type: string, nullable: true }
        publisher_id: { type: integer, nullable: true }
        publish_date: { type: string, nullable: true }
        brand_id: { type: integer, nullable: true }
        book_series_id: { type: integer, nullable: true }
        binding_type: { type: string, nullable: true }
        paper_type: { type: string, nullable: true }
        pages: { type: integer, nullable: true }
        book_count: { type: integer, nullable: true }
        language: { type: string, nullable: true }
        compose_type: { type: string, nullable: true }
        price: { type: number, nullable: true }
        purchase_price: { type: number, nullable: true }
        purchase_date: { type: string, nullable: true }
        thumb_image: { type: string, nullable: true }
        link: { type: string, nullable: true }
        category_id: { type: integer, nullable: true }
        bookshelf_id: { type: integer, nullable: true }
        read_state: { type: string, nullable: true }
        catalog: { type: string, nullable: true }
        introduction: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        registered: { type: boolean, nullable: true }
        edition: { type: string, nullable: true }
        printing_info: { type: string, nullable: true }
        printed_number: { type: integer, nullable: true }
        douban_score: { type: number, nullable: true }
        purchase_store: { type: string, nullable: true }
        tags: { type: array, nullable: true, items: { type: string } }
        in_wish: { type: boolean }
    BookUpdate:
      type: object
      properties:
        isbn: { type: string }
        title: { type: string }
        title_cn: { type: string }
        author_ids: { type: array, items: { type: integer } }
        translator: { type: string, nullable: true }
        publisher_id: { type: integer, nullable: true }
        publish_date: { type: string, nullable: true }
        brand_id: { type: integer, nullable: true }
        book_series_id: { type: integer, nullable: true }
        binding_type: { type: string, nullable: true }
        paper_type: { type: string, nullable: true }
        pages: { type: integer, nullable: true }
        book_count: { type: integer, nullable: true }
        language: { type: string, nullable: true }
        compose_type: { type: string, nullable: true }
        price: { type: number, nullable: true }
        purchase_price: { type: number, nullable: true }
        purchase_date: { type: string, nullable: true }
        thumb_image: { type: string, nullable: true }
        link: { type: string, nullable: true }
        category_id: { type: integer, nullable: true }
        bookshelf_id: { type: integer, nullable: true }
        read_state: { type: string, nullable: true }
        catalog: { type: string, nullable: true }
        introduction: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        registered: { type: boolean, nullable: true }
        edition: { type: string, nullable: true }
        printing_info: { type: string, nullable: true }
        printed_number: { type: integer, nullable: true }
        douban_score: { type: number, nullable: true }
        purchase_store: { type: string, nullable: true }
        tags: { type: array, nullable: true, items: { type: string } }
        in_wish: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BookResponse:
      type: object
      properties:
        id: { type: integer }
        isbn: { type: string }
        title: { type: string }
        title_cn: { type: string }
        authors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        translator: { type: string, nullable: true }
        publisher: { $ref: "#/components/schemas/PublisherSimple", nullable: true }
        publish_date: { type: string, format: date-time, nullable: true }
        brand: { $ref: "#/components/schemas/BrandSimple", nullable: true }
        book_series: { $ref: "#/components/schemas/SeriesSimple", nullable: true }
        binding_type: { type: string, nullable: true }
        paper_type: { type: string, nullable: true }
        pages: { type: integer, nullable: true }
        book_count: { type: integer, nullable: true }
        language: { type: string, nullable: true }
        compose_type: { type: string, nullable: true }
        price: { type: number, nullable: true }
        purchase_price: { type: number, nullable: true }
        purchase_date: { type: string, format: date-time, nullable: true }
        thumb_image: { type: string, nullable: true }
        link: { type: string, nullable: true }
        category: { $ref: "#/components/schemas/CategorySimple", nullable: true }
        bookshelf: { $ref: "#/components/schemas/BookshelfSimple", nullable: true }
        read_state: { type: string, nullable: true }
        catalog: { type: string, nullable: true }
        introduction: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        registered: { type: boolean, nullable: true }
        edition: { type: string, nullable: true }
        printing_info: { type: string, nullable: true }
        printed_number: { type: integer, nullable: true }
        douban_score: { type: number, nullable: true }
        purchase_store: { type: string, nullable: true }
        tags: { type: array, nullable: true, items: { type: string } }
        in_wish: { type: boolean, nullable: true }

    # ── Simple ref types ──
    PublisherSimple:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    BrandSimple:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    SeriesSimple:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    CategorySimple:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    BookshelfSimple:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    # ── Author ──
    AuthorCreation:
      type: object
      required: [name, name_cn, nation]
      properties:
        name: { type: string }
        name_cn: { type: string }
        nation: { type: string }
        dynasty: { type: string }
        intro: { type: string }
        photo: { type: string }
    AuthorUpdate:
      type: object
      properties:
        name: { type: string }
        name_cn: { type: string }
        nation: { type: string }
        dynasty: { type: string }
        intro: { type: string }
        photo: { type: string }
    AuthorResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        name_cn: { type: string }
        nation: { type: string }
        dynasty: { type: string, nullable: true }
        intro: { type: string, nullable: true }
        photo: { type: string, nullable: true }
        books:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/BookSimple"

    # ── Book Simple (used in collections/authors) ──
    BookSimple:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        title_cn: { type: string, nullable: true }
        thumb_image: { type: string, nullable: true }
        isbn: { type: string, nullable: true }
        authors:
          type: array
          nullable: true
          items: { type: string }

    # ── Publisher ──
    PublisherCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
        logo: { type: string }
    PublisherUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
        logo: { type: string }
    PublisherResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        logo: { type: string, nullable: true }

    # ── Brand ──
    BrandCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
    BrandUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
    BrandResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }

    # ── Series ──
    BookSeriesCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
    BookSeriesUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
    BookSeriesResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }

    # ── Category ──
    CategoryCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        parent: { type: integer, description: "Parent category ID" }
        intro: { type: string }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string }
        parent_id: { type: integer, description: "Parent category ID" }
        intro: { type: string }
    CategoryResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        parent_id: { type: integer, nullable: true }
        intro: { type: string, nullable: true }
        depth: { type: integer }
        path: { type: string, nullable: true }

    # ── Bookshelf ──
    BookshelfCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
    BookshelfUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
    BookshelfResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }

    # ── Book Collection ──
    BookCollectionCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
    BookCollectionUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
    AddBookToCollection:
      type: object
      required: [book_id]
      properties:
        book_id: { type: integer }
    BatchAddBooks:
      type: object
      required: [book_ids]
      properties:
        book_ids: { type: array, items: { type: integer } }
    BookCollectionSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        total_books: { type: integer }
    BookCollectionResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        total_books: { type: integer, nullable: true }
        books:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/BookSimple"
    BookCollectionListResponse:
      type: object
      properties:
        book_collections:
          type: array
          items:
            $ref: "#/components/schemas/BookCollectionSummary"
        total_pages: { type: integer }
        total_collections: { type: integer }

    # ── Reading Plan ──
    ReadingPlanCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        intro: { type: string }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
    ReadingPlanUpdate:
      type: object
      properties:
        name: { type: string }
        intro: { type: string }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
    AddBookToPlan:
      type: object
      required: [book_id]
      properties:
        book_id: { type: integer }
    ReadingPlanBookSimple:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        title_cn: { type: string, nullable: true }
        thumb_image: { type: string, nullable: true }
        isbn: { type: string, nullable: true }
        authors:
          type: array
          nullable: true
          items: { type: string }
        read_state: { type: string, nullable: true }
        book_count: { type: integer, nullable: true }
    ReadingPlanSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        created_at: { type: string, nullable: true }
        total_books: { type: integer }
        progress: { type: number, nullable: true }
    ReadingPlanResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        intro: { type: string, nullable: true }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        total_books: { type: integer, nullable: true }
        progress: { type: number, nullable: true }
        books:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ReadingPlanBookSimple"
    ReadingPlanListResponse:
      type: object
      properties:
        reading_plans:
          type: array
          items:
            $ref: "#/components/schemas/ReadingPlanSummary"
        total_pages: { type: integer }
        total_plans: { type: integer }

    # ── Application ──
    ApplicationCreation:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        link: { type: string }
        sort_order: { type: integer }
    ApplicationUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        link: { type: string }
        sort_order: { type: integer }
    ApplicationResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        link: { type: string, nullable: true }
        sort_order: { type: integer, nullable: true }

    # ── RAG ──
    RagSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        limit: { type: integer, default: 10 }
        min_score: { type: number, default: 0.3 }

    # ── ISBN Lookup ──
    IsbnLookupResponse:
      type: object
      required: [isbn, source]
      properties:
        isbn: { type: string }
        title: { type: string }
        title_cn: { type: string }
        publisher_name: { type: string }
        publish_date: { type: string }
        pages: { type: integer, nullable: true }
        price: { type: number, nullable: true }
        summary: { type: string }
        introduction: { type: string }
        thumb_image: { type: string }
        binding_type: { type: string }
        douban_score: { type: number, nullable: true }
        author_names: { type: array, items: { type: string } }
        translator: { type: string }
        language: { type: string }
        source: { type: string }
        link: { type: string }

    # ── Error ──
    HTTPError:
      type: object
      properties:
        detail: { type: string }

paths:
  # ═══════════════════════════════════════════════
  # Auth
  # ═══════════════════════════════════════════════
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegister"
      responses:
        "200":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"

  /api/auth/db-info:
    get:
      tags: [Auth]
      summary: Get current user's database info
      security:
        - BearerAuth: []
      responses:
        "200":
          description: DB info
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  uuid: { type: string }
                  db: { type: string }
                  exists: { type: boolean }
                  type: { type: string }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"

  # ═══════════════════════════════════════════════
  # Books
  # ═══════════════════════════════════════════════
  /api/books:
    get:
      tags: [Books]
      summary: List books (paginated)
      description: Returns books with in_wish=false only.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: sort_by, in: query, schema: { type: string, default: title, enum: [title, created_at, book_series] } }
        - { name: isbn, in: query, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: publisher, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
      responses:
        "200":
          description: Paginated book list
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookResponse"
                  total_pages: { type: integer }
                  total_books: { type: integer }
    post:
      tags: [Books]
      summary: Create a new book
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreation"
      responses:
        "200":
          description: Created book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"

  /api/books/search:
    get:
      tags: [Books]
      summary: Search books with filters
      description: Returns books with in_wish=false only.
      parameters:
        - { name: isbn, in: query, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: publisher, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"

  /api/books/titles:
    get:
      tags: [Books]
      summary: Get all book titles (lightweight, for dropdowns)
      description: Returns {id, name} pairs for non-wishlist books.
      responses:
        "200":
          description: Book title list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }

  /api/books/{book_id}:
    get:
      tags: [Books]
      summary: Get book details
      parameters:
        - { name: book_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "404":
          description: Book not found
    put:
      tags: [Books]
      summary: Update a book
      security:
        - BearerAuth: []
      parameters:
        - { name: book_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
    delete:
      tags: [Books]
      summary: Delete a book
      security:
        - BearerAuth: []
      parameters:
        - { name: book_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/books/{book_id}/similar:
    get:
      tags: [Books]
      summary: Get similar books
      parameters:
        - { name: book_id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 5 } }
      responses:
        "200":
          description: Similar books
          content:
            application/json:
              schema:
                type: object
                properties:
                  similar_books:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookSimple"
                  total_similar_books: { type: integer }

  # ═══════════════════════════════════════════════
  # Authors
  # ═══════════════════════════════════════════════
  /api/authors:
    get:
      tags: [Authors]
      summary: List authors (paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
