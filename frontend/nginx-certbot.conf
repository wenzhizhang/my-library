# =============================================================================
# certbot 验证专用配置 — 最小化, 无 upstream 依赖
# =============================================================================
server {
  listen 80;
  server_name _;

  # certbot HTTP-01 验证路径
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 其他请求: 在证书获取阶段返回 200
  location / {
    return 200 "certbot-standby\n";
    add_header Content-Type text/plain;
  }
}
