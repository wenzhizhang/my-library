services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_IP: ${SERVER_IP:-localhost}
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_IP=${SERVER_IP:-localhost}
    volumes:
      - ./demo.db:/app/demo.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend
    environment:
      - REACT_APP_ENV=production
    restart: unless-stopped
