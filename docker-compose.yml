services:
  # ---- 反向代理入口 ----
  # 单独的 nginx 容器，统一入口 + 自动 HTTPS（通过 Certbot）。
  # 设置 DOMAIN + CERTBOT_EMAIL 环境变量以启用 HTTPS。
  nginx:
    image: ${NGINX_IMAGE:-my-library-nginx:local}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    restart: unless-stopped

  # ---- my-library 后端 ----
  backend:
    image: ${BACKEND_IMAGE:-my-library-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVER_IP: ${SERVER_IP:-localhost}
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_IP=${SERVER_IP:-localhost}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - DOUBAN_KEY=${DOUBAN_KEY:-}
      - ROOT_DB_PATH=/app/root-db/root.db
    volumes:
      - my-library-data:/app/data
      - ./config/projects.json:/app/config/projects.json:ro
      - ./backend/config:/app/config:ro
      - root-db-data:/app/root-db
    restart: unless-stopped

  # ---- my-library 前端 ----
  # 纯静态文件服务器，端口 3000，通过 nginx 反向代理访问。
  frontend:
    image: ${FRONTEND_IMAGE:-my-library-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  my-library-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-www:
    driver: local
  root-db-data:
    driver: local
