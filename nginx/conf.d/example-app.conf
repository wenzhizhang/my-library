# =============================================================================
# 示例：添加一个新应用的反向代理配置
#
# 用法：
#   1. 复制为 your-app.conf
#   2. 修改 upstream 名称和端口
#   3. 在 docker-compose.yml 中添加对应 service
#   4. 重新构建 nginx 镜像或挂载配置卷
#
# 注意：my-library 的配置由 start.sh 在运行时动态生成。
#       添加新应用可以保留此文件作为独立配置。
# =============================================================================

# ---------- 场景 A：独立子域名（新增 server 块） ----------
# server {
#     listen 80;
#     server_name app2.example.com;
#
#     location / {
#         proxy_pass http://app2:3001;
#         include /etc/nginx/includes/proxy-common.conf;
#     }
# }

# ---------- 场景 B：路径前缀区分（在已有 server 块中追加） ----------
# location /app2/ {
#     proxy_pass http://app2:3001/;
#     include /etc/nginx/includes/proxy-common.conf;
# }

# ---------- 场景 C：WebSocket 应用 ----------
# location /ws-app/ {
#     proxy_pass http://ws-app:5000/;
#     include /etc/nginx/includes/proxy-common.conf;
#     proxy_read_timeout 3600s;
# }
