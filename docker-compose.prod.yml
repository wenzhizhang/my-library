services:
  # ---- 反向代理入口 ----
  nginx:
    image: ccr.ccs.tencentyun.com/${CCR_NAMESPACE:-my-library}/my-library-nginx:${TAG:-latest}
    pull_policy: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
    environment:
      - DOMAIN=${DOMAIN:-}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    restart: unless-stopped

  # ---- my-library 后端 ----
  backend:
    image: ccr.ccs.tencentyun.com/${CCR_NAMESPACE:-my-library}/my-library-backend:${TAG:-latest}
    pull_policy: always
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_IP=${SERVER_IP}
      - DATA_DIR=/app/data
      - HF_ENDPOINT=https://hf-mirror.com
      - DOUBAN_KEY=${DOUBAN_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MEDIA_CACHE_ENABLED=${MEDIA_CACHE_ENABLED:-false}
      - ROOT_DB_PATH=/app/root-db/root.db
    restart: unless-stopped
    volumes:
      - backend-data:/app/data
      - media-cache:/app/data/media-cache
      # /app/config comes from the image (COPY . .).  Do not bind-mount a host
      # directory over it: a missing/empty host dir silently hides every config
      # file and the backend dies on import (nations.json).
      - root-db-data:/app/root-db
      - model-cache:/app/.model_cache

  # ---- my-library 前端 ----
  frontend:
    image: ccr.ccs.tencentyun.com/${CCR_NAMESPACE:-my-library}/my-library-frontend:${TAG:-latest}
    pull_policy: always
    depends_on:
      - backend
    restart: unless-stopped

  # ---- Solar System Simulator ----
  solar:
    image: ccr.ccs.tencentyun.com/solar-system/solar:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
  certbot-etc:
    driver: local
  root-db-data:
    driver: local
  certbot-www:
    driver: local

  media-cache:
    driver: local

  model-cache:
    driver: local
