version: '3.8'

services:
  backend:
    image: ccr.ccs.tencentyun.com/${CCR_NAMESPACE:-my-library}/my-library-backend:${TAG:-latest}
    pull_policy: always
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_IP=${SERVER_IP}
      - DATA_DIR=/app/data
    restart: unless-stopped
    volumes:
      - backend-data:/app/data

  frontend:
    image: ccr.ccs.tencentyun.com/${CCR_NAMESPACE:-my-library}/my-library-frontend:${TAG:-latest}
    pull_policy: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend
    environment:
      - REACT_APP_ENV=production
      - DOMAIN=${DOMAIN:-}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  backend-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-www:
    driver: local
